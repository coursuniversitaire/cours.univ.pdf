<!-- Analytics scripts are loaded only after cookie consent -->
<script>
(function () {

  const CONSENT_KEY = 'cookie_consent';

  const bannerStyles = `
    .cookie-banner {
      position: fixed;
      left: 20px;
      right: 20px;
      bottom: 20px;
      z-index: 999999;
      background: #ffffff;
      color: #222;
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,.18);
      padding: 20px;
      font-size: 14px;
    }
    .cookie-content {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }
    .cookie-content p { margin: 8px 0; line-height: 1.5; }
    .cookie-content a { text-decoration: underline; }
    .cookie-buttons { display: flex; gap: 10px; flex-shrink: 0; }
    .cookie-btn {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 600;
    }
    .cookie-reject { background: #eee; color: #222; }
    .cookie-accept { background: #111; color: #fff; }
    @media (max-width: 700px) {
      .cookie-banner { left: 10px; right: 10px; bottom: 10px; }
      .cookie-content { flex-direction: column; align-items: stretch; gap: 15px; }
      .cookie-buttons { width: 100%; }
      .cookie-btn { flex: 1; }
    }
  `;

  function createCookieBanner() {
    if (document.getElementById('cookie-banner')) return;

    const style = document.createElement('style');
    style.textContent = bannerStyles;
    document.head.appendChild(style);

    const banner = document.createElement('div');
    banner.id = 'cookie-banner';
    banner.className = 'cookie-banner';
    banner.style.display = 'none';
    banner.innerHTML = `
      <div class="cookie-content">
        <div>
          <strong>Respect de votre vie privee</strong>
          <p>Nous utilisons des cookies et technologies similaires pour mesurer l'audience du site et ameliorer votre experience. Vous pouvez accepter ou refuser les cookies d'analyse.</p>
          <a href="/cours.univ.pdf/politique-confidentialite.html" target="_blank" rel="noopener">En savoir plus</a>
        </div>
        <div class="cookie-buttons">
          <button type="button" onclick="rejectCookies()" class="cookie-btn cookie-reject">Refuser</button>
          <button type="button" onclick="acceptCookies()" class="cookie-btn cookie-accept">Accepter</button>
        </div>
      </div>`;
    document.body.appendChild(banner);
  }

  function loadAnalytics() {

    if (window.__analyticsLoaded) return;
    window.__analyticsLoaded = true;

    /* =========================
       Google Analytics
    ========================= */

    const gaScript = document.createElement('script');
    gaScript.async = true;
    gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-G55SJ5C5L0';
    document.head.appendChild(gaScript);

    window.dataLayer = window.dataLayer || [];

    window.gtag = function () {
      window.dataLayer.push(arguments);
    };

    gtag('js', new Date());
    gtag('config', 'G-G55SJ5C5L0');

    /* =========================
       Microsoft Clarity
    ========================= */

    (function(c,l,a,r,i,t,y){
      c[a]=c[a]||function(){
        (c[a].q=c[a].q||[]).push(arguments)
      };

      t=l.createElement(r);
      t.async=1;
      t.src="https://www.clarity.ms/tag/"+i;

      y=l.getElementsByTagName(r)[0];
      y.parentNode.insertBefore(t,y);

    })(window, document, "clarity", "script", "xb7gvowmx9");

  }


  /* =========================
     Check previous consent
  ========================= */

  const consent = localStorage.getItem(CONSENT_KEY);

  if (consent === 'accepted') {
    loadAnalytics();
  }


  /* =========================
     Expose functions
  ========================= */

  window.acceptCookies = function () {

    localStorage.setItem(CONSENT_KEY, 'accepted');

    loadAnalytics();

    hideCookieBanner();
  };


  window.rejectCookies = function () {

    localStorage.setItem(CONSENT_KEY, 'rejected');

    hideCookieBanner();
  };


  window.openCookieSettings = function () {

    document.getElementById('cookie-banner').style.display = 'block';

  };


  function hideCookieBanner() {

    const banner = document.getElementById('cookie-banner');

    if (banner) {
      banner.style.display = 'none';
    }

  }


  /* =========================
     Show banner if no choice
  ========================= */

  document.addEventListener('DOMContentLoaded', function () {

    createCookieBanner();

    if (!consent) {

      const banner = document.getElementById('cookie-banner');

      if (banner) {
        banner.style.display = 'block';
      }

    }

  });

})();
</script>
